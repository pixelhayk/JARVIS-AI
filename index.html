<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020b12">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020b12;
    --ink: #dff7ff;
    --muted: #7fb4c6;
    --cyan: #36d6ff;
    --deep: #0b6d8c;
    --amber: #ffb02e;
    --panel: rgba(6, 36, 52, .62);
    --line: rgba(54, 214, 255, .30);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    color: var(--ink);
    font-family: 'Noto Sans Armenian', system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 36%, rgba(30, 150, 190, .28), transparent 62%),
      repeating-linear-gradient(0deg, rgba(54,214,255,.045) 0 1px, transparent 1px 36px),
      repeating-linear-gradient(90deg, rgba(54,214,255,.045) 0 1px, transparent 1px 36px),
      var(--bg);
  }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    max-width: 640px;
    margin: 0 auto;
  }

  /* ---------- Logo ---------- */
  .logo-wrap {
    flex: 1 1 0;
    display: grid;
    place-items: center;
    min-height: 0;
    transition: flex-grow .7s cubic-bezier(.4, 0, .2, 1);
  }
  .logo {
    width: min(84vw, 380px);
    aspect-ratio: 1;
    transition: width .7s cubic-bezier(.4, 0, .2, 1);
  }
  .logo svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .spin-slow { transform-origin: 200px 200px; animation: spin 70s linear infinite; }
  .spin-rev  { transform-origin: 200px 200px; animation: spin 26s linear infinite reverse; }
  .spin-mid  { transform-origin: 200px 200px; animation: spin 38s linear infinite; }
  .spin-in   { transform-origin: 200px 200px; animation: spin 16s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .breathe { animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .hud-text { transition: opacity .4s; }

  /* ---------- Chat state ---------- */
  .messages {
    flex: 0 1 0;
    overflow-y: auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: flex-grow .7s cubic-bezier(.4, 0, .2, 1);
    scroll-behavior: smooth;
  }
  .has-chat .logo-wrap { flex: 0 0 96px; }
  .has-chat .logo { width: 84px; }
  .has-chat .hud-text { opacity: 0; }
  .has-chat .messages { flex: 1 1 0; padding-top: 4px; padding-bottom: 12px; }

  .msg {
    max-width: 88%;
    padding: 11px 15px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(54, 214, 255, .24), rgba(11, 109, 140, .45));
    border: 1px solid var(--line);
    border-radius: 16px 16px 3px 16px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--cyan);
    border-radius: 3px 16px 16px 16px;
  }
  .msg.err { color: #ffc2a0; border-color: rgba(255, 176, 46, .55); }

  .dots { display: inline-flex; gap: 5px; padding: 4px 0; }
  .dots i { width: 7px; height: 7px; background: var(--cyan); animation: dot 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; background: var(--amber); }
  @keyframes dot { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

  /* ---------- Input ---------- */
  .bar { padding: 10px 14px 14px; display: flex; gap: 10px; align-items: flex-end; }
  .bar textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 13px 18px;
    font: inherit;
    font-size: 16px; /* stops iOS zoom on focus */
    line-height: 1.4;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    outline: none;
    backdrop-filter: blur(8px);
    transition: border-color .2s, box-shadow .2s;
  }
  .bar textarea::placeholder { color: var(--muted); }
  .bar textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(54, 214, 255, .2); }
  .bar button {
    flex: 0 0 48px;
    height: 48px;
    border: 1px solid var(--cyan);
    border-radius: 14px;
    cursor: pointer;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, rgba(54,214,255,.35), rgba(11,109,140,.7));
    box-shadow: 0 0 18px rgba(54, 214, 255, .35);
    transition: transform .15s, opacity .2s;
  }
  .bar button:active { transform: scale(.92); }
  .bar button:disabled { opacity: .4; cursor: default; }
  .bar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .bar svg { width: 22px; height: 22px; }

  @media (prefers-reduced-motion: reduce) {
    .spin-slow, .spin-rev, .spin-mid, .spin-in, .breathe, .blink, .dots i { animation: none !important; }
    .logo-wrap, .logo, .messages { transition: none; }
  }
</style>
</head>
<body>
<main class="app" id="app">
  <section class="logo-wrap">
    <div class="logo" id="logo" role="img" aria-label="JARVIS"></div>
  </section>

  <section class="messages" id="messages" aria-live="polite"></section>

  <form class="bar" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Գրիր այստեղ՝ ինչ տեղեկություն է պետք…" aria-label="Հարցի դաշտ"></textarea>
    <button type="submit" id="send" aria-label="Ուղարկել">
      <svg viewBox="0 0 24 24" fill="none" stroke="#eaffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</main>

<script>
/* ================== SETTINGS ================== */
// Gemini API key (https://aistudio.google.com/apikey). Visitors do not need to enter anything.
// WARNING: anyone can read this key in the page source. See the notes in the chat.
const GEMINI_API_KEY = "AQ.Ab8RN6IZjHdDUybwn_EKu9r3QHPQyqlOb63iGtHzjTRb_bOTsA";
// Tried in order; if the first one is not available (404), the next one is used.
const MODELS = ["gemini-3.8-flash", "gemini-flash-latest", "gemini-3.5-flash", "gemini-flash-lite-latest"];
const SHOW_LOGO_TEXT = true;   // false = ring only, without "J.A.R.V.I.S." in the middle
const SYSTEM_PROMPT =
  "You are JARVIS, a friendly and precise assistant. " +
  "Always reply in the same language the user writes in (Armenian, Russian, English...). " +
  "If the user writes Armenian using Latin letters, reply in Armenian script. " +
  "Give clear, short answers with the information the person asked for.";

/* ================== LOGO (HUD rings) ================== */
const C = 200;
function polar(r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [C + r * Math.cos(a), C + r * Math.sin(a)];
}
function arc(r, a0, a1) {
  const [x0, y0] = polar(r, a0), [x1, y1] = polar(r, a1);
  const large = ((a1 - a0) % 360) > 180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

function buildLogo() {
  const cy = "#36d6ff", am = "#ffb02e";
  let s = `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke-linecap="round">`;

  // outer thick ring (slow rotation)
  s += `<g class="spin-slow" stroke="${cy}">`;
  [[8,82],[90,168],[178,262],[270,352]].forEach(([a,b]) => { s += `<path d="${arc(188,a,b)}" stroke-width="6"/>`; });
  [[0,28],[190,214],[300,322]].forEach(([a,b]) => { s += `<path d="${arc(196,a,b)}" stroke-width="2" opacity=".8"/>`; });
  s += `</g>`;

  // tick ring
  s += `<g class="spin-rev" stroke="${cy}">`;
  for (let i = 0; i < 120; i++) {
    const d = i * 3, long = i % 5 === 0;
    const [x0, y0] = polar(172, d), [x1, y1] = polar(long ? 154 : 160, d);
    s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="${long ? 2 : 1.2}" opacity="${long ? 1 : .7}"/>`;
  }
  s += `</g>`;

  // segmented light band
  s += `<g class="spin-mid">
    <path d="${arc(136, 200, 440)}" stroke="rgba(54,214,255,.38)" stroke-width="26" stroke-linecap="butt" stroke-dasharray="14 2.5"/>
    <path d="${arc(149.5, 200, 440)}" stroke="${cy}" stroke-width="1.6"/>
    <path d="${arc(122.5, 200, 440)}" stroke="${cy}" stroke-width="1.6"/>
  </g>`;

  // amber details + dots
  s += `<path class="breathe" d="${arc(111, 205, 300)}" stroke="${am}" stroke-width="3"/>`;
  s += `<path d="${arc(111, 150, 196)}" stroke="${am}" stroke-width="4.5"/>`;
  [-24, -12, 0, 12, 24].forEach((d, i) => {
    const [x, y] = polar(148, d);
    s += `<circle class="breathe" style="animation-delay:-${i * .5}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#ffe14d" stroke="none"/>`;
  });

  // inner core
  s += `<circle cx="${C}" cy="${C}" r="100" fill="rgba(2,18,28,.88)" stroke="${cy}" stroke-width="2.5"/>`;
  s += `<circle class="spin-in" cx="${C}" cy="${C}" r="90" stroke="${cy}" stroke-width="1.5" stroke-dasharray="2 7" opacity=".7"/>`;
  s += `<circle cx="${C}" cy="${C}" r="72" stroke="${cy}" stroke-width="1" opacity=".3"/>`;
  s += `<path d="M${C-100} ${C}H${C-80} M${C+80} ${C}H${C+100} M${C} ${C-100}V${C-82} M${C} ${C+82}V${C+100}" stroke="${cy}" stroke-width="1.5" opacity=".6"/>`;
  s += `</g>`;

  if (SHOW_LOGO_TEXT) {
    s += `<g class="hud-text" text-anchor="middle">
      <text x="${C}" y="${C - 2}" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="800" font-size="25" letter-spacing="3" fill="#eaffff" stroke="${cy}" stroke-width=".4">J.A.R.V.I.S.</text>
      <text id="hudStatus" x="${C}" y="${C + 24}" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="600" font-size="10" letter-spacing="2.6" fill="#bfefff">INITIALIZING...</text>
    </g>`;
  }
  s += `</svg>`;
  document.getElementById("logo").innerHTML = s;
}
buildLogo();

const statusEl = document.getElementById("hudStatus");
function setStatus(t) { if (statusEl) statusEl.textContent = t; }
setTimeout(() => setStatus("ONLINE"), 1800);

/* ================== CHAT ================== */
const app = document.getElementById("app");
const box = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const history = [];

function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

function getKey() {
  if (GEMINI_API_KEY) return GEMINI_API_KEY;
  try {
    let k = localStorage.getItem("jarvis_gemini_key");
    if (k) return k;
    k = (prompt("Գրիր քո Gemini API key-ը") || "").trim();
    if (k) localStorage.setItem("jarvis_gemini_key", k);
    return k;
  } catch (e) {
    return (prompt("Գրիր քո Gemini API key-ը") || "").trim();
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const BUSY = [429, 500, 502, 503, 504];

async function askGemini(key) {
  let lastErr;
  for (const m of MODELS) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try { return await callModel(m, key); }
      catch (e) {
        lastErr = e;
        if (e.status === 404) break;               // model not available -> next model
        if (!BUSY.includes(e.status)) throw e;     // key or other error -> stop
        setStatus("RETRYING...");
        if (attempt === 0) await sleep(1200);      // short pause, retry the same model once
      }
    }
  }
  throw lastErr;
}

function friendlyError(e) {
  if (e.status === 401 || e.status === 403) return "Սխալ՝ API key-ը չի ընդունվում։ " + e.message;
  if (BUSY.includes(e.status)) return "Gemini-ն հիմա ծանրաբեռնված է։ Փորձիր նորից մի քանի վայրկյան հետո։";
  return "Սխալ՝ " + e.message;
}

async function callModel(model, key) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: history
    })
  });
  const data = await res.json();
  if (!res.ok) {
    const err = new Error(data?.error?.message || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  const parts = data?.candidates?.[0]?.content?.parts || [];
  const text = parts.filter(p => !p.thought).map(p => p.text || "").join("").trim();
  if (!text) throw new Error("Պատասխան չեկավ (դատարկ արդյունք).");
  return text;
}

async function send(text) {
  const key = getKey();
  if (!key) return;

  app.classList.add("has-chat");
  addMsg(text, "user");
  history.push({ role: "user", parts: [{ text }] });

  const wait = document.createElement("div");
  wait.className = "msg bot";
  wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  box.appendChild(wait);
  box.scrollTop = box.scrollHeight;

  sendBtn.disabled = true;
  setStatus("THINKING...");
  try {
    const answer = await askGemini(key);
    history.push({ role: "model", parts: [{ text: answer }] });
    wait.textContent = answer;
    setStatus("ONLINE");
  } catch (e) {
    history.pop();
    wait.classList.add("err");
    wait.textContent = friendlyError(e);
    setStatus("ERROR");
    if (!GEMINI_API_KEY && (e.status === 400 || e.status === 403)) {
      try { localStorage.removeItem("jarvis_gemini_key"); } catch (_) {}
    }
  } finally {
    sendBtn.disabled = false;
    box.scrollTop = box.scrollHeight;
    input.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  autoGrow();
  send(text);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover: hover)").matches) {
    e.preventDefault();
    form.requestSubmit();
  }
});

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
}
input.addEventListener("input", autoGrow);
</script>
</body>
</html>
